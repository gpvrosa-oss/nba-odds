name: Recolher odds NBA

on:
  # As recolhas automaticas passaram para vigia.yml (2026-11-05). Aqui ficam so os modos manuais.
  workflow_dispatch:          # permite correr a mao no separador Actions
    inputs:
      modo:
        description: "props, historico, completo, fecho, sonda ou espn"
        default: props

permissions:
  contents: write

concurrency:
  group: recolher
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Recolher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ inputs.modo }}" = "sonda" ]; then
            python sondar_props.py; exit 0
          elif [ "${{ inputs.modo }}" = "lesoes" ]; then
            mkdir -p props/lesoes; python -c "import requests,datetime;open('props/lesoes/'+datetime.datetime.utcnow().strftime('%Y-%m-%dT%H%MZ')+'.json','w').write(requests.get('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries',timeout=30).text)"
            python historico.py
          elif [ "${{ inputs.modo }}" = "fontes" ]; then
            python sondar_fontes.py; exit 0
          elif [ "${{ inputs.modo }}" = "espn" ]; then
            python sondar_espn.py; exit 0
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.modo }}" = "props" ]; then
            python props.py
            python historico.py
            python apostas_props.py
          elif [ "${{ inputs.modo }}" = "historico" ]; then
            python historico.py 2024-10-22
            python apostas_props.py
          else
            python recolher.py "${{ inputs.modo }}"
          fi
          python resumo.py
      - name: Guardar no repositorio
        run: |
          git config user.name "recolha-odds"
          git config user.email "actions@users.noreply.github.com"
          git add odds RESUMO.md; if [ -d props ]; then git add props; fi; if [ -d dados ]; then git add dados; fi
          git commit -m "Odds $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
