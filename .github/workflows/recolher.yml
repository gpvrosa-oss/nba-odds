name: Recolher odds NBA

on:
  schedule:
    # Horas em UTC (Lisboa no inverno = UTC; no verao = UTC+1).
    # O GitHub atrasa muito as tarefas marcadas a hora certa, por isso uso minutos "estranhos".
    - cron: "7 11 * * *"     # completo (3 pedidos)
    - cron: "7 18 * * *"     # completo (3 pedidos)
    # Fecho: a cada 15 minutos entre as 22:00 e as 04:00 UTC. So gasta 1 pedido quando ha um
    # jogo a comecar nos proximos 45 minutos (a verificacao e gratis).
    - cron: "7,22,37,52 22,23,0,1,2,3 * * *"
  workflow_dispatch:          # permite correr a mao no separador Actions
    inputs:
      modo:
        description: "completo ou fecho"
        default: completo

permissions:
  contents: write

concurrency:
  group: recolher
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recolher
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python recolher.py "${{ inputs.modo }}"
          elif [ "${{ github.event.schedule }}" = "7,22,37,52 22,23,0,1,2,3 * * *" ]; then
            python recolher.py fecho
          else
            python recolher.py completo
          fi
      - name: Guardar no repositorio
        run: |
          git config user.name "recolha-odds"
          git config user.email "actions@users.noreply.github.com"
          git add odds
          git commit -m "Odds $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
